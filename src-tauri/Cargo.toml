[package]
name = "sekaitext"
version = "5.9.14"
description = "Project Sekai story translation and subtitle editing desktop application"
authors = ["SnowGlow-aww"]
license = "MIT"
repository = "https://github.com/SnowGlow-aww/SekaiText-Next"
homepage = "https://sakimizuki.accr.cc/web/index.html"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sekaitext_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["protocol-asset", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

[target."cfg(target_os = \"android\")".dependencies]
# Android alone needs SAF-backed file access. The asset protocol feature is kept
# on the root Tauri dependency because the CLI synchronizes Cargo features from
# platform configuration during `tauri android build`; its scope remains limited
# to the Live2D object cache on every platform.
tauri-plugin-fs = "2.5.0"

# Shell/sidecar execution and second-instance handling are desktop-only. Keeping
# them out of the mobile dependency graph prevents the Android APK from bundling
# command-execution code that it neither initializes nor grants permissions for.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
